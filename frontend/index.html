<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A web-based scientific calculator powered by C++ and Drogon."
    >

    <title>C++ Scientific Calculator</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

    <main class="calculator">

        <header class="calculator-header">

            <div class="title-group">

                <h1>
                    Scientific Calculator
                </h1>

                <p>
                    Powered by C++ & Drogon
                </p>

            </div>

            <div class="mode-badge">
                DEG
            </div>

        </header>


        <section
            class="display"
            aria-live="polite"
        >

            <div
                id="expression"
                class="expression"
            ></div>

            <div
                id="display"
                class="display-value"
            >
                0
            </div>

        </section>


        <div
            id="error"
            class="error"
            role="alert"
        ></div>


        <section
            class="buttons"
            aria-label="Scientific calculator keypad"
        >

            <!-- ========================================= -->
            <!-- SCIENTIFIC FUNCTIONS -->
            <!-- ========================================= -->

            <button
                class="button scientific"
                type="button"
                onclick="scientific('sin')"
            >
                sin
            </button>

            <button
                class="button scientific"
                type="button"
                onclick="scientific('cos')"
            >
                cos
            </button>

            <button
                class="button scientific"
                type="button"
                onclick="scientific('tan')"
            >
                tan
            </button>

            <button
                class="button scientific"
                type="button"
                onclick="scientific('log')"
            >
                log
            </button>


            <button
                class="button scientific"
                type="button"
                onclick="scientific('ln')"
            >
                ln
            </button>

            <button
                class="button scientific"
                type="button"
                onclick="scientific('sqrt')"
            >
                √x
            </button>

            <button
                class="button control"
                type="button"
                onclick="toggleSign()"
            >
                +/−
            </button>

            <button
                class="button danger"
                type="button"
                onclick="clearCalculator()"
            >
                C
            </button>


            <!-- ========================================= -->
            <!-- NUMBER PAD -->
            <!-- ========================================= -->

            <button
                class="button number"
                type="button"
                onclick="inputNumber('7')"
            >
                7
            </button>

            <button
                class="button number"
                type="button"
                onclick="inputNumber('8')"
            >
                8
            </button>

            <button
                class="button number"
                type="button"
                onclick="inputNumber('9')"
            >
                9
            </button>

            <button
                class="button operator"
                type="button"
                onclick="chooseOperation('divide')"
            >
                ÷
            </button>


            <button
                class="button number"
                type="button"
                onclick="inputNumber('4')"
            >
                4
            </button>

            <button
                class="button number"
                type="button"
                onclick="inputNumber('5')"
            >
                5
            </button>

            <button
                class="button number"
                type="button"
                onclick="inputNumber('6')"
            >
                6
            </button>

            <button
                class="button operator"
                type="button"
                onclick="chooseOperation('multiply')"
            >
                ×
            </button>


            <button
                class="button number"
                type="button"
                onclick="inputNumber('1')"
            >
                1
            </button>

            <button
                class="button number"
                type="button"
                onclick="inputNumber('2')"
            >
                2
            </button>

            <button
                class="button number"
                type="button"
                onclick="inputNumber('3')"
            >
                3
            </button>

            <button
                class="button operator"
                type="button"
                onclick="chooseOperation('subtract')"
            >
                −
            </button>


            <button
                class="button number zero"
                type="button"
                onclick="inputNumber('0')"
            >
                0
            </button>

            <button
                class="button number"
                type="button"
                onclick="inputDecimal()"
            >
                .
            </button>

            <button
                class="button operator"
                type="button"
                onclick="chooseOperation('add')"
            >
                +
            </button>


            <!-- ========================================= -->
            <!-- ACTION ROW -->
            <!-- ========================================= -->

            <button
                class="button backspace"
                type="button"
                onclick="backspace()"
            >
                ⌫
            </button>

            <button
                class="button equals"
                type="button"
                onclick="calculateResult()"
            >
                =
            </button>

        </section>


        <footer class="calculator-footer">

            <span>
                C++ Scientific Calculator
            </span>

            <span class="version">
                v1.2
            </span>

        </footer>

    </main>


    <script src="/app.js"></script>

</body>

</html>
