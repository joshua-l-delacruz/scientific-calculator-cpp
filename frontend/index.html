<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Scientific calculator powered by C++ and Drogon."
    >

    <title>
        C++ Scientific Calculator
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

    <main class="calculator">

        <!-- ==================================================
             HEADER
        =================================================== -->

        <header class="calculator-header">

            <div class="title-group">

                <h1>
                    Scientific Calculator
                </h1>

                <p>
                    Powered by C++ & Drogon
                </p>

            </div>


            <div class="mode-badge">
                DEG
            </div>

        </header>


        <!-- ==================================================
             DISPLAY
        =================================================== -->

        <section
            class="display"
            aria-live="polite"
        >

            <div
                id="expression"
                class="expression"
            ></div>


            <div
                id="display"
                class="display-value"
            >
                0
            </div>

        </section>


        <div
            id="error"
            class="error"
            role="alert"
        ></div>


        <!-- ==================================================
             ADVANCED SCIENTIFIC KEYPAD
        =================================================== -->

        <section
            class="scientific-grid"
            aria-label="Advanced scientific functions"
        >

            <button
                class="button advanced"
                onclick="constantValue('pi')"
            >
                π
            </button>


            <button
                class="button advanced"
                onclick="constantValue('e')"
            >
                e
            </button>


            <button
                class="button advanced"
                onclick="scientific('square')"
            >
                x²
            </button>


            <button
                class="button advanced"
                onclick="scientific('cube')"
            >
                x³
            </button>


            <button
                class="button advanced power"
                onclick="chooseOperation('power')"
            >
                xʸ
            </button>


            <button
                class="button advanced"
                onclick="scientific('reciprocal')"
            >
                1/x
            </button>


            <button
                class="button advanced"
                onclick="scientific('percent')"
            >
                %
            </button>


            <button
                class="button advanced"
                onclick="scientific('factorial')"
            >
                x!
            </button>


            <button
                class="button scientific"
                onclick="scientific('sin')"
            >
                sin
            </button>


            <button
                class="button scientific"
                onclick="scientific('cos')"
            >
                cos
            </button>


            <button
                class="button scientific"
                onclick="scientific('tan')"
            >
                tan
            </button>


            <button
                class="button scientific"
                onclick="scientific('log')"
            >
                log
            </button>


            <button
                class="button scientific"
                onclick="scientific('ln')"
            >
                ln
            </button>


            <button
                class="button scientific"
                onclick="scientific('sqrt')"
            >
                √x
            </button>


            <button
                class="button control"
                onclick="toggleSign()"
            >
                +/−
            </button>


            <button
                class="button danger"
                onclick="clearCalculator()"
            >
                C
            </button>

        </section>


        <!-- ==================================================
             MAIN KEYPAD
        =================================================== -->

        <section
            class="keypad"
            aria-label="Calculator keypad"
        >

            <!-- 7 8 9 ÷ -->

            <button
                class="button number"
                onclick="inputNumber('7')"
            >
                7
            </button>

            <button
                class="button number"
                onclick="inputNumber('8')"
            >
                8
            </button>

            <button
                class="button number"
                onclick="inputNumber('9')"
            >
                9
            </button>

            <button
                class="button operator"
                onclick="chooseOperation('divide')"
            >
                ÷
            </button>


            <!-- 4 5 6 × -->

            <button
                class="button number"
                onclick="inputNumber('4')"
            >
                4
            </button>

            <button
                class="button number"
                onclick="inputNumber('5')"
            >
                5
            </button>

            <button
                class="button number"
                onclick="inputNumber('6')"
            >
                6
            </button>

            <button
                class="button operator"
                onclick="chooseOperation('multiply')"
            >
                ×
            </button>


            <!-- 1 2 3 − -->

            <button
                class="button number"
                onclick="inputNumber('1')"
            >
                1
            </button>

            <button
                class="button number"
                onclick="inputNumber('2')"
            >
                2
            </button>

            <button
                class="button number"
                onclick="inputNumber('3')"
            >
                3
            </button>

            <button
                class="button operator"
                onclick="chooseOperation('subtract')"
            >
                −
            </button>


            <!-- 0 . + -->

            <button
                class="button number zero"
                onclick="inputNumber('0')"
            >
                0
            </button>

            <button
                class="button number"
                onclick="inputDecimal()"
            >
                .
            </button>

            <button
                class="button operator"
                onclick="chooseOperation('add')"
            >
                +
            </button>


            <!-- BACKSPACE / EQUALS -->

            <button
                class="button backspace"
                onclick="backspace()"
            >
                ⌫
            </button>

            <button
                class="button equals"
                onclick="calculateResult()"
            >
                =
            </button>

        </section>


        <!-- ==================================================
             FOOTER
        =================================================== -->

        <footer class="calculator-footer">

            <span>
                C++ Scientific Calculator
            </span>

            <span class="version">
                v2.0
            </span>

        </footer>

    </main>


    <script src="/app.js"></script>

</body>

</html>
