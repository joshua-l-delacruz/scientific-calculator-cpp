<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="C++ scientific calculator with expression parsing, memory, history, DEG and RAD modes."
    >

    <title>
        C++ Scientific Calculator
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

    <main class="calculator">

        <!-- ==================================================
             HEADER
        =================================================== -->

        <header class="calculator-header">

            <div class="title-group">

                <h1>
                    Scientific Calculator
                </h1>

                <p>
                    C++ Expression Engine
                </p>

            </div>


            <button
                id="modeButton"
                class="mode-button"
                type="button"
                onclick="toggleAngleMode()"
            >
                DEG
            </button>

        </header>


        <!-- ==================================================
             DISPLAY
        =================================================== -->

        <section
            class="display"
            aria-live="polite"
        >

            <div class="display-meta">

                <span
                    id="memoryIndicator"
                    class="memory-indicator"
                ></span>

                <span
                    id="displayMode"
                    class="display-mode"
                >
                    DEG
                </span>

            </div>


            <div
                id="expressionPreview"
                class="expression"
            >
                Ready
            </div>


            <div
                id="display"
                class="display-value"
            >
                0
            </div>

        </section>


        <div
            id="error"
            class="error"
            role="alert"
        ></div>


        <!-- ==================================================
             MEMORY
        =================================================== -->

        <section
            class="memory-grid"
            aria-label="Calculator memory controls"
        >

            <button
                class="memory-button"
                type="button"
                onclick="memoryClear()"
            >
                MC
            </button>


            <button
                class="memory-button"
                type="button"
                onclick="memoryRecall()"
            >
                MR
            </button>


            <button
                class="memory-button"
                type="button"
                onclick="memoryAdd()"
            >
                M+
            </button>


            <button
                class="memory-button"
                type="button"
                onclick="memorySubtract()"
            >
                M−
            </button>


            <button
                class="memory-button ans-button"
                type="button"
                onclick="appendAnswer()"
            >
                Ans
            </button>

        </section>


        <!-- ==================================================
             PARENTHESES / CONSTANTS
        =================================================== -->

        <section class="expression-controls">

            <button
                class="button expression-button"
                type="button"
                onclick="appendToken('(')"
            >
                (
            </button>


            <button
                class="button expression-button"
                type="button"
                onclick="appendToken(')')"
            >
                )
            </button>


            <button
                class="button advanced"
                type="button"
                onclick="appendConstant('pi')"
            >
                π
            </button>


            <button
                class="button advanced"
                type="button"
                onclick="appendConstant('e')"
            >
                e
            </button>

        </section>


        <!-- ==================================================
             SCIENTIFIC FUNCTIONS
        =================================================== -->

        <section class="scientific-grid">

            <button
                class="button scientific"
                type="button"
                onclick="appendFunction('sin')"
            >
                sin
            </button>


            <button
                class="button scientific"
                type="button"
                onclick="appendFunction('cos')"
            >
                cos
            </button>


            <button
                class="button scientific"
                type="button"
                onclick="appendFunction('tan')"
            >
                tan
            </button>


            <button
                class="button scientific"
                type="button"
                onclick="appendFunction('log')"
            >
                log
            </button>


            <button
                class="button scientific"
                type="button"
                onclick="appendFunction('ln')"
            >
                ln
            </button>


            <button
                class="button scientific"
                type="button"
                onclick="appendFunction('sqrt')"
            >
                √
            </button>


            <button
                class="button advanced"
                type="button"
                onclick="appendSquare()"
            >
                x²
            </button>


            <button
                class="button advanced"
                type="button"
                onclick="appendCube()"
            >
                x³
            </button>


            <button
                class="button advanced"
                type="button"
                onclick="appendToken('^')"
            >
                xʸ
            </button>


            <button
                class="button advanced"
                type="button"
                onclick="appendFactorial()"
            >
                x!
            </button>


            <button
                class="button control"
                type="button"
                onclick="toggleSignExpression()"
            >
                +/−
            </button>


            <button
                class="button danger"
                type="button"
                onclick="clearCalculator()"
            >
                C
            </button>

        </section>


        <!-- ==================================================
             KEYPAD
        =================================================== -->

        <section class="keypad">

            <button
                class="button number"
                type="button"
                onclick="appendNumber('7')"
            >
                7
            </button>

            <button
                class="button number"
                type="button"
                onclick="appendNumber('8')"
            >
                8
            </button>

            <button
                class="button number"
                type="button"
                onclick="appendNumber('9')"
            >
                9
            </button>

            <button
                class="button operator"
                type="button"
                onclick="appendOperator('/')"
            >
                ÷
            </button>


            <button
                class="button number"
                type="button"
                onclick="appendNumber('4')"
            >
                4
            </button>

            <button
                class="button number"
                type="button"
                onclick="appendNumber('5')"
            >
                5
            </button>

            <button
                class="button number"
                type="button"
                onclick="appendNumber('6')"
            >
                6
            </button>

            <button
                class="button operator"
                type="button"
                onclick="appendOperator('*')"
            >
                ×
            </button>


            <button
                class="button number"
                type="button"
                onclick="appendNumber('1')"
            >
                1
            </button>

            <button
                class="button number"
                type="button"
                onclick="appendNumber('2')"
            >
                2
            </button>

            <button
                class="button number"
                type="button"
                onclick="appendNumber('3')"
            >
                3
            </button>

            <button
                class="button operator"
                type="button"
                onclick="appendOperator('-')"
            >
                −
            </button>


            <button
                class="button number zero"
                type="button"
                onclick="appendNumber('0')"
            >
                0
            </button>

            <button
                class="button number"
                type="button"
                onclick="appendDecimal()"
            >
                .
            </button>

            <button
                class="button operator"
                type="button"
                onclick="appendOperator('+')"
            >
                +
            </button>


            <button
                class="button backspace"
                type="button"
                onclick="backspace()"
            >
                ⌫
            </button>

            <button
                class="button equals"
                type="button"
                onclick="evaluateExpression()"
            >
                =
            </button>

        </section>


        <!-- ==================================================
             EXPRESSION
        =================================================== -->

        <section class="raw-expression-section">

            <div class="expression-label-row">

                <label for="expressionInput">
                    Expression
                </label>

                <span
                    id="expressionModeLabel"
                    class="expression-mode-label"
                >
                    Trigonometry: Degrees
                </span>

            </div>


            <input
                id="expressionInput"
                class="expression-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="Example: sin(30) + sqrt(144)"
            >

        </section>


        <!-- ==================================================
             HISTORY
        =================================================== -->

        <section class="history-section">

            <div class="history-header">

                <div>

                    <h2>
                        History
                    </h2>

                    <span id="historyCount">
                        0 calculations
                    </span>

                </div>


                <button
                    id="clearHistoryButton"
                    class="clear-history-button"
                    type="button"
                    onclick="clearHistory()"
                >
                    Clear
                </button>

            </div>


            <div
                id="historyList"
                class="history-list"
            >

                <div class="history-empty">
                    No calculations yet.
                </div>

            </div>

        </section>


        <!-- ==================================================
             FOOTER
        =================================================== -->

        <footer class="calculator-footer">

            <span>
                C++ Scientific Calculator
            </span>

            <span class="version">
                v5.0
            </span>

        </footer>

    </main>


    <script src="/app.js"></script>

</body>

</html>
