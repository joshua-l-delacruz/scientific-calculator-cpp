<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Scientific calculator powered by a C++ expression parser and Drogon."
    >

    <title>
        C++ Scientific Calculator
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

    <main class="calculator">

        <!-- ==================================================
             HEADER
        =================================================== -->

        <header class="calculator-header">

            <div class="title-group">

                <h1>
                    Scientific Calculator
                </h1>

                <p>
                    C++ Expression Engine
                </p>

            </div>


            <div class="mode-badge">
                DEG
            </div>

        </header>


        <!-- ==================================================
             DISPLAY
        =================================================== -->

        <section
            class="display"
            aria-live="polite"
        >

            <div
                id="expressionPreview"
                class="expression"
            >
                Ready
            </div>


            <div
                id="display"
                class="display-value"
            >
                0
            </div>

        </section>


        <div
            id="error"
            class="error"
            role="alert"
        ></div>


        <!-- ==================================================
             EXPRESSION CONTROLS
        =================================================== -->

        <section class="expression-controls">

            <button
                class="button expression-button"
                onclick="appendToken('(')"
            >
                (
            </button>


            <button
                class="button expression-button"
                onclick="appendToken(')')"
            >
                )
            </button>


            <button
                class="button advanced"
                onclick="appendConstant('pi')"
            >
                π
            </button>


            <button
                class="button advanced"
                onclick="appendConstant('e')"
            >
                e
            </button>

        </section>


        <!-- ==================================================
             ADVANCED FUNCTIONS
        =================================================== -->

        <section class="scientific-grid">

            <button
                class="button scientific"
                onclick="appendFunction('sin')"
            >
                sin
            </button>


            <button
                class="button scientific"
                onclick="appendFunction('cos')"
            >
                cos
            </button>


            <button
                class="button scientific"
                onclick="appendFunction('tan')"
            >
                tan
            </button>


            <button
                class="button scientific"
                onclick="appendFunction('log')"
            >
                log
            </button>


            <button
                class="button scientific"
                onclick="appendFunction('ln')"
            >
                ln
            </button>


            <button
                class="button scientific"
                onclick="appendFunction('sqrt')"
            >
                √
            </button>


            <button
                class="button advanced"
                onclick="appendSquare()"
            >
                x²
            </button>


            <button
                class="button advanced"
                onclick="appendCube()"
            >
                x³
            </button>


            <button
                class="button advanced"
                onclick="appendToken('^')"
            >
                xʸ
            </button>


            <button
                class="button advanced"
                onclick="appendFactorial()"
            >
                x!
            </button>


            <button
                class="button control"
                onclick="toggleSignExpression()"
            >
                +/−
            </button>


            <button
                class="button danger"
                onclick="clearCalculator()"
            >
                C
            </button>

        </section>


        <!-- ==================================================
             MAIN KEYPAD
        =================================================== -->

        <section class="keypad">

            <button
                class="button number"
                onclick="appendNumber('7')"
            >
                7
            </button>

            <button
                class="button number"
                onclick="appendNumber('8')"
            >
                8
            </button>

            <button
                class="button number"
                onclick="appendNumber('9')"
            >
                9
            </button>

            <button
                class="button operator"
                onclick="appendOperator('/')"
            >
                ÷
            </button>


            <button
                class="button number"
                onclick="appendNumber('4')"
            >
                4
            </button>

            <button
                class="button number"
                onclick="appendNumber('5')"
            >
                5
            </button>

            <button
                class="button number"
                onclick="appendNumber('6')"
            >
                6
            </button>

            <button
                class="button operator"
                onclick="appendOperator('*')"
            >
                ×
            </button>


            <button
                class="button number"
                onclick="appendNumber('1')"
            >
                1
            </button>

            <button
                class="button number"
                onclick="appendNumber('2')"
            >
                2
            </button>

            <button
                class="button number"
                onclick="appendNumber('3')"
            >
                3
            </button>

            <button
                class="button operator"
                onclick="appendOperator('-')"
            >
                −
            </button>


            <button
                class="button number zero"
                onclick="appendNumber('0')"
            >
                0
            </button>

            <button
                class="button number"
                onclick="appendDecimal()"
            >
                .
            </button>

            <button
                class="button operator"
                onclick="appendOperator('+')"
            >
                +
            </button>


            <button
                class="button backspace"
                onclick="backspace()"
            >
                ⌫
            </button>

            <button
                class="button equals"
                onclick="evaluateExpression()"
            >
                =
            </button>

        </section>


        <!-- ==================================================
             RAW EXPRESSION
        =================================================== -->

        <section class="raw-expression-section">

            <label for="expressionInput">
                Expression
            </label>


            <input
                id="expressionInput"
                class="expression-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="Example: (2+3)^4"
            >

        </section>


        <!-- ==================================================
             FOOTER
        =================================================== -->

        <footer class="calculator-footer">

            <span>
                C++ Scientific Calculator
            </span>

            <span class="version">
                v3.0
            </span>

        </footer>

    </main>


    <script src="/app.js"></script>

</body>

</html>
