name: Calculation bug
description: Report a reproducible scientific or programmer calculation problem.
title: "[Calculation]: "
labels: [bug]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Calculator mode
      options: [Scientific, Programmer]
    validations:
      required: true
  - type: input
    id: input
    attributes:
      label: Exact input or operation
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: Include angle mode, base, word size, and signedness where applicable.
  - type: input
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
