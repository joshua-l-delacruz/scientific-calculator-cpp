name: Build and Test C++ Calculator


on:

  push:

    branches:

      - main


  pull_request:

    branches:

      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      - name: Wait for server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then

              echo
              echo "C++ server is healthy."

              exit 0

            fi

            sleep 2

          done

          docker logs scientific-calculator

          exit 1


      - name: Test Version 8 health
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["status"] == "ok"
          assert data["version"] == "8.0"
          assert data["programmerMode"] is True
          assert data["signedProgrammerMode"] is True
          assert data["interactiveBits"] is True
          assert data["programmerWidths"] == "8,16,32,64"
          assert data["rotateOperations"] == "ROL,ROR"
          '


      - name: Test scientific calculator
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2^8+5!","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 376
          '


      - name: Test 8-bit unsigned conversion
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"255",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["hex"] == "FF"
          assert data["bin"] == "11111111"
          assert data["unsignedDec"] == "255"
          assert data["signedDec"] == "-1"
          '


      - name: Test 8-bit signed negative one
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"-1",
              "base":"DEC",
              "width":8,
              "signed":true
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["dec"] == "-1"
          assert data["unsignedDec"] == "255"
          assert data["hex"] == "FF"
          assert data["bin"] == "11111111"
          '


      - name: Test 16-bit signed minimum
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"-32768",
              "base":"DEC",
              "width":16,
              "signed":true
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["signedDec"] == "-32768"
          assert data["hex"] == "8000"
          '


      - name: Test bit toggle
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"TOGGLE",
              "left":"0",
              "right":"7",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "128"
          assert data["bin"] == "10000000"
          '


      - name: Test 8-bit NOT
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"NOT",
              "left":"0",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "255"
          assert data["hex"] == "FF"
          '


      - name: Test 8-bit left shift wrapping
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"SHL",
              "left":"128",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "0"
          '


      - name: Test signed arithmetic right shift
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"SHR",
              "left":"-8",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":true
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["signedDec"] == "-4"
          '


      - name: Test rotate left
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"ROL",
              "left":"129",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "3"
          assert data["bin"] == "00000011"
          '


      - name: Test rotate right
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"ROR",
              "left":"3",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "129"
          assert data["bin"] == "10000001"
          '


      - name: Test bitwise AND
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"AND",
              "left":"12",
              "right":"10",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "8"
          '


      - name: Test signed range validation
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"128",
              "base":"DEC",
              "width":8,
              "signed":true
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep "outside the selected bit width"


      - name: Test Version 8 HTML
        run: |
          HTML=$(curl -fsS \
            http://localhost:8080/)

          echo "$HTML" | grep "v8.0"
          echo "$HTML" | grep "Bit editor"
          echo "$HTML" | grep "ROL"
          echo "$HTML" | grep "ROR"
          echo "$HTML" | grep "Signed"
          echo "$HTML" | grep "64"


      - name: Test Version 8 JavaScript
        run: |
          JS=$(curl -fsS \
            http://localhost:8080/app.js)

          echo "$JS" | grep "toggleProgrammerBit"
          echo "$JS" | grep "setProgrammerWidth"
          echo "$JS" | grep "setProgrammerSigned"
          echo "$JS" | grep "renderBitGrid"


      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
