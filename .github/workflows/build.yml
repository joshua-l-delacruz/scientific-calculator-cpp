name: Build and Test C++ Scientific Calculator

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      - name: Wait for C++ server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then
              echo
              echo "C++ server is healthy."
              exit 0
            fi

            sleep 2

          done

          docker logs scientific-calculator

          exit 1


      - name: Test Version 5.1 health
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["version"] == "5.1"
          assert data["implicitMultiplication"] is True
          '


      - name: Test normal multiplication
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"25*4","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 100
          '


      - name: Test recalled-value implicit multiplication bug
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(-100)50","mode":"RAD"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == -5000
          '


      - name: Test number before parentheses
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2(5+3)","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 16
          '


      - name: Test adjacent parentheses
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(2+3)(4+5)","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 45
          '


      - name: Test number times pi
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2pi","mode":"RAD"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import math
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] -
              2 * math.pi
          ) < 1e-12
          '


      - name: Test number times function
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"3sin(30)","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] -
              1.5
          ) < 1e-12
          '


      - name: Test DEG mode
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(30)","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] -
              0.5
          ) < 1e-12
          '


      - name: Test RAD mode
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(pi/2)","mode":"RAD"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] -
              1
          ) < 1e-12
          '


      - name: Test factorial and power
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2^8+5!","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 376
          '


      - name: Test divide by zero
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"10/0","mode":"DEG"}')

          echo "$RESPONSE" | \
            grep '"error":"Cannot divide by zero."' 


      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
