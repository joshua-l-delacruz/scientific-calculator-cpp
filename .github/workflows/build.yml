name: Build and Test C++ Scientific Calculator


on:

  push:

    branches:

      - main


  pull_request:

    branches:

      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      # ======================================================
      # START
      # ======================================================

      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      # ======================================================
      # WAIT
      # ======================================================

      - name: Wait for C++ server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then

              echo
              echo "C++ server is healthy."

              exit 0

            fi

            echo "Waiting for server..."

            sleep 2

          done


          docker logs scientific-calculator

          exit 1


      # ======================================================
      # WEBSITE
      # ======================================================

      - name: Test Version 4 website
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/)


          echo "$RESPONSE" | \
            grep "v4.0"


          echo "$RESPONSE" | \
            grep "modeButton"


      # ======================================================
      # HEALTH
      # ======================================================

      - name: Test Version 4 health endpoint
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"version":"4.0"'


          echo "$RESPONSE" | \
            grep '"angleModes":"DEG,RAD"'


      # ======================================================
      # BASIC PRECEDENCE
      # ======================================================

      - name: Test arithmetic precedence
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2+3*4","mode":"DEG"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 14
          assert data["mode"] == "DEG"
          '


      # ======================================================
      # DEG TEST
      # ======================================================

      - name: Test DEG sine
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(30)","mode":"DEG"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import math
          import sys

          data = json.load(sys.stdin)

          assert data["mode"] == "DEG"
          assert abs(data["result"] - 0.5) < 1e-12
          '


      # ======================================================
      # RAD TEST
      # ======================================================

      - name: Test RAD sine
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(pi/2)","mode":"RAD"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["mode"] == "RAD"
          assert abs(data["result"] - 1.0) < 1e-12
          '


      # ======================================================
      # DEG / RAD DIFFERENCE
      # ======================================================

      - name: Verify DEG and RAD produce different results
        run: |
          DEG_RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(1)","mode":"DEG"}')


          RAD_RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(1)","mode":"RAD"}')


          export DEG_RESPONSE
          export RAD_RESPONSE


          python3 - <<'PY'
          import json
          import os

          deg = json.loads(
              os.environ["DEG_RESPONSE"]
          )

          rad = json.loads(
              os.environ["RAD_RESPONSE"]
          )

          assert abs(
              deg["result"] -
              rad["result"]
          ) > 0.1

          print(
              "DEG sin(1):",
              deg["result"]
          )

          print(
              "RAD sin(1):",
              rad["result"]
          )
          PY


      # ======================================================
      # POWER ASSOCIATIVITY
      # ======================================================

      - name: Test right associative powers
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2^3^2","mode":"DEG"}')


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 512
          '


      # ======================================================
      # UNARY / POWER PRECEDENCE
      # ======================================================

      - name: Test negative power precedence
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"-2^2","mode":"DEG"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == -4
          '


      # ======================================================
      # NEGATIVE EXPONENT
      # ======================================================

      - name: Test negative exponent
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2^-2","mode":"DEG"}')


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] -
              0.25
          ) < 1e-12
          '


      # ======================================================
      # FACTORIAL
      # ======================================================

      - name: Test factorial
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"5!","mode":"DEG"}')


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 120
          '


      # ======================================================
      # COMPOUND RAD EXPRESSION
      # ======================================================

      - name: Test compound RAD expression
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(pi/2)+sqrt(144)","mode":"RAD"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] -
              13.0
          ) < 1e-12
          '


      # ======================================================
      # INVALID MODE
      # ======================================================

      - name: Test invalid angle mode
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(30)","mode":"XYZ"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"error":"Angle mode must be DEG or RAD."' 


      # ======================================================
      # DIVIDE BY ZERO
      # ======================================================

      - name: Test divide by zero
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"10/0","mode":"DEG"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"error":"Cannot divide by zero."' 


      # ======================================================
      # LOGS
      # ======================================================

      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
