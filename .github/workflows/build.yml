name: Build and Test C++ Scientific Calculator


on:

  push:

    branches:

      - main


  pull_request:

    branches:

      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      # ======================================================
      # START
      # ======================================================

      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      # ======================================================
      # WAIT
      # ======================================================

      - name: Wait for C++ server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then

              echo
              echo "C++ server is healthy."

              exit 0

            fi

            echo "Waiting for server..."

            sleep 2

          done


          docker logs scientific-calculator

          exit 1


      # ======================================================
      # VERSION
      # ======================================================

      - name: Test Version 5 website
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/)


          echo "$RESPONSE" | \
            grep "v5.0"


          echo "$RESPONSE" | \
            grep "memoryRecall"


          echo "$RESPONSE" | \
            grep "historyList"


          echo "$RESPONSE" | \
            grep "Ans"


      # ======================================================
      # JAVASCRIPT
      # ======================================================

      - name: Test Version 5 frontend logic
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/app.js)


          echo "$RESPONSE" | \
            grep "memoryAdd"


          echo "$RESPONSE" | \
            grep "appendAnswer"


          echo "$RESPONSE" | \
            grep "calculationHistory"


          echo "$RESPONSE" | \
            grep "sessionStorage"


      # ======================================================
      # HEALTH
      # ======================================================

      - name: Test Version 5 health endpoint
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["status"] == "ok"
          assert data["version"] == "5.0"
          assert data["engine"] == "cpp-expression-parser"
          '


      # ======================================================
      # BASIC C++ EXPRESSION
      # ======================================================

      - name: Test basic C++ expression
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(25+5)*3","mode":"DEG"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 90
          '


      # ======================================================
      # DEG
      # ======================================================

      - name: Test DEG mode
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(30)","mode":"DEG"}')


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 0.5
          ) < 1e-12
          '


      # ======================================================
      # RAD
      # ======================================================

      - name: Test RAD mode
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(pi/2)","mode":"RAD"}')


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 1
          ) < 1e-12
          '


      # ======================================================
      # COMPOUND EXPRESSION
      # ======================================================

      - name: Test advanced expression
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2^8+5!","mode":"DEG"}')


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 376
          '


      # ======================================================
      # PRECEDENCE
      # ======================================================

      - name: Test unary exponent precedence
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"-2^2","mode":"DEG"}')


          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == -4
          '


      # ======================================================
      # ERROR HANDLING
      # ======================================================

      - name: Test divide by zero
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"10/0","mode":"DEG"}')


          echo "$RESPONSE" | \
            grep '"error":"Cannot divide by zero."' 


      # ======================================================
      # LOGS
      # ======================================================

      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
