name: Build and Test C++ Calculator

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      - name: Wait for server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then
              echo
              echo "C++ server is healthy."
              exit 0
            fi

            sleep 2

          done

          docker logs scientific-calculator

          exit 1


      - name: Test Version 7 health
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["status"] == "ok"
          assert data["version"] == "7.0"
          assert data["programmerMode"] is True
          assert data["programmerIntegerSize"] == "64-bit unsigned"
          assert data["programmerBases"] == "BIN,OCT,DEC,HEX"
          '


      - name: Test scientific calculator
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2^8+5!","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 376
          '


      - name: Test DEC to HEX conversion
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{"operation":"CONVERT","left":"255","base":"DEC"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["dec"] == "255"
          assert data["hex"] == "FF"
          assert data["oct"] == "377"
          assert data["bin"] == "11111111"
          '


      - name: Test HEX conversion
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{"operation":"CONVERT","left":"FF","base":"HEX"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["dec"] == "255"
          '


      - name: Test binary AND
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{"operation":"AND","left":"1100","right":"1010","base":"BIN"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["bin"] == "1000"
          assert data["dec"] == "8"
          '


      - name: Test OR
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{"operation":"OR","left":"12","right":"10","base":"DEC"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["dec"] == "14"
          '


      - name: Test XOR
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{"operation":"XOR","left":"12","right":"10","base":"DEC"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["dec"] == "6"
          '


      - name: Test left shift
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{"operation":"SHL","left":"5","right":"2","base":"DEC"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["dec"] == "20"
          '


      - name: Test right shift
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{"operation":"SHR","left":"20","right":"2","base":"DEC"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["dec"] == "5"
          '


      - name: Test programmer invalid digit
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{"operation":"CONVERT","left":"102","base":"BIN"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep "Invalid digit"


      - name: Test Version 7 HTML
        run: |
          HTML=$(curl -fsS \
            http://localhost:8080/)

          echo "$HTML" | grep "v7.0"
          echo "$HTML" | grep "Programmer"
          echo "$HTML" | grep "BIN"
          echo "$HTML" | grep "HEX"
          echo "$HTML" | grep "XOR"


      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
