name: Build and Test C++ Scientific Calculator


on:

  push:

    branches:

      - main


  pull_request:

    branches:

      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v6


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Docker image

        run: |

          docker build \
            -t scientific-calculator-cpp \
            .


      # ======================================================
      # START
      # ======================================================

      - name: Start calculator server

        run: |

          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      # ======================================================
      # WAIT
      # ======================================================

      - name: Wait for C++ server

        run: |

          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then

              echo

              echo "C++ server is healthy."

              exit 0

            fi


            echo "Waiting for C++ server..."


            sleep 2

          done


          docker logs scientific-calculator


          exit 1


      # ======================================================
      # WEBSITE
      # ======================================================

      - name: Test website

        run: |

          RESPONSE=$(curl -fsS \
            http://localhost:8080/)


          echo "$RESPONSE" | \
            grep "Scientific Calculator"


          echo "$RESPONSE" | \
            grep "v2.0"


      # ======================================================
      # HEALTH
      # ======================================================

      - name: Test health endpoint

        run: |

          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"status":"ok"'


          echo "$RESPONSE" | \
            grep '"version":"2.0"'


      # ======================================================
      # ADDITION
      # ======================================================

      - name: Test addition

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"add","left":25,"right":15}')


          echo "$RESPONSE" | \
            grep '"result":40'


      # ======================================================
      # POWER
      # ======================================================

      - name: Test power

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"power","left":2,"right":8}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"result":256'


      # ======================================================
      # SQUARE
      # ======================================================

      - name: Test square

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"square","value":12}')


          echo "$RESPONSE" | \
            grep '"result":144'


      # ======================================================
      # CUBE
      # ======================================================

      - name: Test cube

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"cube","value":5}')


          echo "$RESPONSE" | \
            grep '"result":125'


      # ======================================================
      # RECIPROCAL
      # ======================================================

      - name: Test reciprocal

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"reciprocal","value":4}')


          echo "$RESPONSE"


      # ======================================================
      # PERCENTAGE
      # ======================================================

      - name: Test percent

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"percent","value":25}')


          echo "$RESPONSE"


      # ======================================================
      # FACTORIAL
      # ======================================================

      - name: Test factorial

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"factorial","value":5}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"result":120'


      # ======================================================
      # PI
      # ======================================================

      - name: Test pi

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"pi"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"operation":"pi"'


      # ======================================================
      # E
      # ======================================================

      - name: Test Euler constant

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"e"}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"operation":"e"'


      # ======================================================
      # SQRT
      # ======================================================

      - name: Test square root

        run: |

          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"sqrt","value":144}')


          echo "$RESPONSE" | \
            grep '"result":12'


      # ======================================================
      # ERROR — FACTORIAL DECIMAL
      # ======================================================

      - name: Test invalid factorial

        run: |

          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"factorial","value":5.5}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"error":"Factorial requires a whole number."'


      # ======================================================
      # ERROR — RECIPROCAL ZERO
      # ======================================================

      - name: Test reciprocal zero

        run: |

          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/calculate \
            -H "Content-Type: application/json" \
            -d '{"operation":"reciprocal","value":0}')


          echo "$RESPONSE"


          echo "$RESPONSE" | \
            grep '"error":"Cannot calculate the reciprocal of zero."'


      # ======================================================
      # LOGS
      # ======================================================

      - name: Show container logs

        if: always()

        run: |

          docker logs scientific-calculator
