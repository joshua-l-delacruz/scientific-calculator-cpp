name: Build C++ Scientific Calculator

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .

      - name: Show built image
        run: |
          docker images scientific-calculator-cpp
