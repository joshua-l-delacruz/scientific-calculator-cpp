name: Build and Test C++ Calculator


on:

  push:

    branches:

      - main


  pull_request:

    branches:

      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      - name: Wait for C++ server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then

              echo
              echo "C++ server is healthy."

              exit 0

            fi

            echo "Waiting for C++ server..."

            sleep 2

          done

          docker logs scientific-calculator

          exit 1


      - name: Test C++ backend health
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["status"] == "ok"
          assert data["programmerMode"] is True
          assert data["signedProgrammerMode"] is True
          assert data["interactiveBits"] is True
          assert data["programmerWidths"] == "8,16,32,64"
          assert data["rotateOperations"] == "ROL,ROR"
          '


      - name: Test scientific arithmetic
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{
              "expression":"2^8+5!",
              "mode":"DEG"
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 376
          '


      - name: Test scientific DEG
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{
              "expression":"sin(30)",
              "mode":"DEG"
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 0.5
          ) < 1e-12
          '


      - name: Test scientific RAD
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{
              "expression":"sin(pi/2)",
              "mode":"RAD"
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 1
          ) < 1e-12
          '


      - name: Test 8-bit unsigned
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"255",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["hex"] == "FF"
          assert data["bin"] == "11111111"
          assert data["unsignedDec"] == "255"
          assert data["signedDec"] == "-1"
          '


      - name: Test signed negative number
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"-128",
              "base":"DEC",
              "width":8,
              "signed":true
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["signedDec"] == "-128"
          assert data["unsignedDec"] == "128"
          assert data["hex"] == "80"
          assert data["bin"] == "10000000"
          '


      - name: Test programmer AND
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"AND",
              "left":"12",
              "right":"10",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "8"
          '


      - name: Test programmer OR
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"OR",
              "left":"12",
              "right":"10",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "14"
          '


      - name: Test programmer XOR
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"XOR",
              "left":"12",
              "right":"10",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "6"
          '


      - name: Test programmer NOT
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"NOT",
              "left":"0",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "255"
          '


      - name: Test arithmetic right shift
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"SHR",
              "left":"-8",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":true
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["signedDec"] == "-4"
          '


      - name: Test rotate left
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"ROL",
              "left":"129",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "3"
          assert data["bin"] == "00000011"
          '


      - name: Test rotate right
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"ROR",
              "left":"3",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "129"
          assert data["bin"] == "10000001"
          '


      - name: Test bit toggle
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"TOGGLE",
              "left":"0",
              "right":"7",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "128"
          assert data["bin"] == "10000000"
          '


      - name: Test Version 9 interface
        run: |
          HTML=$(curl -fsS \
            http://localhost:8080/)

          echo "$HTML" | grep "v9.0"
          echo "$HTML" | grep "Programmer History"
          echo "$HTML" | grep "Architecture"
          echo "$HTML" | grep "Copy"
          echo "$HTML" | grep "Overflow"
          echo "$HTML" | grep "/api/programmer"


      - name: Test Version 9 JavaScript
        run: |
          JS=$(curl -fsS \
            http://localhost:8080/app.js)

          echo "$JS" | grep "programmerHistory"
          echo "$JS" | grep "copyProgrammerValue"
          echo "$JS" | grep "saveProgrammerState"
          echo "$JS" | grep "renderProgrammerHistory"
          echo "$JS" | grep "programmerOperationState"


      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
