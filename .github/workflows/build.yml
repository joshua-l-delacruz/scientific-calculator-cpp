name: Build and Test C++ Calculator


on:

  push:

    branches:

      - main


  pull_request:

    branches:

      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      - name: Wait for C++ server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then

              echo
              echo "C++ server is healthy."

              exit 0

            fi

            echo "Waiting for C++ server..."

            sleep 2

          done

          docker logs scientific-calculator

          exit 1


      # ========================================================
      # V9.1 HEALTH TEST
      # ========================================================

      - name: Test Version 9.1 health
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["status"] == "ok"
          assert data["name"] == "C++ Calculator"
          assert data["version"] == "9.1"
          assert data["language"] == "C++"
          assert data["framework"] == "Drogon"

          assert data["scientificMode"] is True
          assert data["programmerMode"] is True
          assert data["signedProgrammerMode"] is True
          assert data["interactiveBits"] is True

          assert data["programmerWidths"] == "8,16,32,64"
          assert data["programmerBases"] == "BIN,OCT,DEC,HEX"
          assert data["rotateOperations"] == "ROL,ROR"

          assert data["apiInfo"] == "/api/info"
          '


      # ========================================================
      # V9.1 API INFORMATION
      # ========================================================

      - name: Test Version 9.1 API info
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/api/info)

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["name"] == "C++ Calculator"
          assert data["version"] == "9.1"
          assert data["language"] == "C++"
          assert data["framework"] == "Drogon"

          assert data["features"]["scientific"] is True
          assert data["features"]["programmer"] is True
          assert data["features"]["signedIntegers"] is True
          assert data["features"]["unsignedIntegers"] is True
          assert data["features"]["bitEditor"] is True
          assert data["features"]["twoComplement"] is True
          assert data["features"]["persistentFrontendState"] is True
          assert data["features"]["programmerHistory"] is True

          assert data["angleModes"] == [
              "DEG",
              "RAD"
          ]

          assert data["programmerBases"] == [
              "BIN",
              "OCT",
              "DEC",
              "HEX"
          ]

          assert data["wordSizes"] == [
              8,
              16,
              32,
              64
          ]

          operations = data["programmerOperations"]

          for operation in [
              "CONVERT",
              "AND",
              "OR",
              "XOR",
              "NOT",
              "SHL",
              "SHR",
              "ROL",
              "ROR",
              "TOGGLE"
          ]:
              assert operation in operations

          assert data["runtime"]["containerized"] is True
          assert data["runtime"]["container"] == "Docker"
          assert data["runtime"]["buildSystem"] == "CMake"
          assert data["runtime"]["ci"] == "GitHub Actions"

          routes = {
              route["path"]: route["method"]
              for route in data["routes"]
          }

          assert routes["/health"] == "GET"
          assert routes["/api/info"] == "GET"
          assert routes["/api/evaluate"] == "POST"
          assert routes["/api/programmer"] == "POST"
          '


      # ========================================================
      # SCIENTIFIC ENGINE
      # ========================================================

      - name: Test scientific arithmetic
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{
              "expression":"2^8+5!",
              "mode":"DEG"
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 376
          '


      - name: Test scientific DEG
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{
              "expression":"sin(30)",
              "mode":"DEG"
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 0.5
          ) < 1e-12
          '


      - name: Test scientific RAD
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{
              "expression":"sin(pi/2)",
              "mode":"RAD"
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 1
          ) < 1e-12
          '


      - name: Test scientific functions
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{
              "expression":"sqrt(144)+log(100)+ln(e)",
              "mode":"DEG"
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 15
          ) < 1e-12
          '


      - name: Test scientific invalid expression
        run: |
          STATUS=$(curl \
            -s \
            -o /tmp/error.json \
            -w "%{http_code}" \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{
              "expression":"2+",
              "mode":"DEG"
            }')

          cat /tmp/error.json

          test "$STATUS" = "400"

          python3 -c '
          import json

          with open("/tmp/error.json") as file:
              data = json.load(file)

          assert "error" in data
          '


      # ========================================================
      # PROGRAMMER CONVERSION
      # ========================================================

      - name: Test 8-bit unsigned conversion
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"255",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["hex"] == "FF"
          assert data["bin"] == "11111111"
          assert data["oct"] == "377"
          assert data["unsignedDec"] == "255"
          assert data["signedDec"] == "-1"
          assert data["engineVersion"] == "9.1"
          '


      - name: Test 8-bit signed negative number
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"-128",
              "base":"DEC",
              "width":8,
              "signed":true
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["signedDec"] == "-128"
          assert data["unsignedDec"] == "128"
          assert data["hex"] == "80"
          assert data["bin"] == "10000000"
          '


      - name: Test 16-bit signed conversion
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"-32768",
              "base":"DEC",
              "width":16,
              "signed":true
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["signedDec"] == "-32768"
          assert data["unsignedDec"] == "32768"
          assert data["hex"] == "8000"
          assert data["bin"] == "1000000000000000"
          '


      # ========================================================
      # BITWISE OPERATIONS
      # ========================================================

      - name: Test programmer AND
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"AND",
              "left":"12",
              "right":"10",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "8"
          assert data["bin"] == "00001000"
          '


      - name: Test programmer OR
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"OR",
              "left":"12",
              "right":"10",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "14"
          assert data["bin"] == "00001110"
          '


      - name: Test programmer XOR
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"XOR",
              "left":"12",
              "right":"10",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "6"
          assert data["bin"] == "00000110"
          '


      - name: Test programmer NOT
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"NOT",
              "left":"0",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "255"
          assert data["hex"] == "FF"
          assert data["bin"] == "11111111"
          '


      # ========================================================
      # SHIFT OPERATIONS
      # ========================================================

      - name: Test left shift
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"SHL",
              "left":"5",
              "right":"2",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "20"
          assert data["bin"] == "00010100"
          '


      - name: Test unsigned right shift
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"SHR",
              "left":"20",
              "right":"2",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "5"
          '


      - name: Test signed arithmetic right shift
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"SHR",
              "left":"-8",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":true
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["signedDec"] == "-4"
          assert data["bin"] == "11111100"
          '


      # ========================================================
      # ROTATION OPERATIONS
      # ========================================================

      - name: Test rotate left
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"ROL",
              "left":"129",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "3"
          assert data["bin"] == "00000011"
          '


      - name: Test rotate right
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"ROR",
              "left":"3",
              "right":"1",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "129"
          assert data["bin"] == "10000001"
          '


      # ========================================================
      # BIT EDITOR BACKEND
      # ========================================================

      - name: Test bit toggle
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"TOGGLE",
              "left":"0",
              "right":"7",
              "base":"DEC",
              "width":8,
              "signed":false
            }')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["unsignedDec"] == "128"
          assert data["bin"] == "10000000"
          '


      # ========================================================
      # VALIDATION
      # ========================================================

      - name: Test invalid signed range
        run: |
          STATUS=$(curl \
            -s \
            -o /tmp/programmer-error.json \
            -w "%{http_code}" \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"128",
              "base":"DEC",
              "width":8,
              "signed":true
            }')

          cat /tmp/programmer-error.json

          test "$STATUS" = "400"

          grep \
            "outside the selected bit width" \
            /tmp/programmer-error.json


      - name: Test invalid programmer width
        run: |
          STATUS=$(curl \
            -s \
            -o /tmp/width-error.json \
            -w "%{http_code}" \
            -X POST \
            http://localhost:8080/api/programmer \
            -H "Content-Type: application/json" \
            -d '{
              "operation":"CONVERT",
              "left":"10",
              "base":"DEC",
              "width":12,
              "signed":false
            }')

          cat /tmp/width-error.json

          test "$STATUS" = "400"

          grep \
            "Bit width must be 8, 16, 32 or 64" \
            /tmp/width-error.json


      # ========================================================
      # FRONTEND
      # ========================================================

      - name: Test Version 9 frontend
        run: |
          HTML=$(curl -fsS \
            http://localhost:8080/)

          echo "$HTML" | grep "v9.0"
          echo "$HTML" | grep "Programmer History"
          echo "$HTML" | grep "Architecture"
          echo "$HTML" | grep "Copy"
          echo "$HTML" | grep "Overflow"
          echo "$HTML" | grep "/api/info"
          echo "$HTML" | grep "/api/programmer"


      - name: Test Version 9 JavaScript
        run: |
          JS=$(curl -fsS \
            http://localhost:8080/app.js)

          echo "$JS" | grep "programmerHistory"
          echo "$JS" | grep "copyProgrammerValue"
          echo "$JS" | grep "saveProgrammerState"
          echo "$JS" | grep "renderProgrammerHistory"
          echo "$JS" | grep "programmerOperationState"


      # ========================================================
      # LOGS
      # ========================================================

      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
