name: Build and Test C++ Scientific Calculator

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      - name: Wait for C++ server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then

              echo
              echo "C++ server is healthy."

              exit 0

            fi

            echo "Waiting for server..."

            sleep 2

          done

          docker logs scientific-calculator

          exit 1


      - name: Test Version 6 health
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["status"] == "ok"
          assert data["version"] == "6.0"
          assert data["engine"] == "cpp-expression-parser"
          assert data["implicitMultiplication"] is True
          '


      - name: Test Version 6 HTML
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/)

          echo "$RESPONSE" | grep "v6.0"
          echo "$RESPONSE" | grep "themeButton"
          echo "$RESPONSE" | grep "copyExpression"
          echo "$RESPONSE" | grep "copyResult"
          echo "$RESPONSE" | grep "toggleHistory"
          echo "$RESPONSE" | grep "About this project"


      - name: Test Version 6 JavaScript
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/app.js)

          echo "$RESPONSE" | grep "navigator.clipboard"
          echo "$RESPONSE" | grep "toggleTheme"
          echo "$RESPONSE" | grep "Calculating with C++"
          echo "$RESPONSE" | grep "toggleHistory"
          echo "$RESPONSE" | grep "memoryRecall"
          echo "$RESPONSE" | grep "appendAnswer"


      - name: Test arithmetic
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(25+5)*3","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 90
          '


      - name: Test implicit multiplication
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(-100)50","mode":"RAD"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == -5000
          '


      - name: Test adjacent parentheses
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(2+3)(4+5)","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 45
          '


      - name: Test DEG trigonometry
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(30)","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 0.5
          ) < 1e-12
          '


      - name: Test RAD trigonometry
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(pi/2)","mode":"RAD"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert abs(
              data["result"] - 1
          ) < 1e-12
          '


      - name: Test factorial and power
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2^8+5!","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == 376
          '


      - name: Test unary exponent precedence
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"-2^2","mode":"DEG"}')

          echo "$RESPONSE" | \
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert data["result"] == -4
          '


      - name: Test divide by zero
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"10/0","mode":"DEG"}')

          echo "$RESPONSE" | \
            grep '"error":"Cannot divide by zero."' 


      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
