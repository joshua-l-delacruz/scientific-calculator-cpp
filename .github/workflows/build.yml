name: Build and Test C++ Scientific Calculator


on:

  push:

    branches:

      - main


  pull_request:

    branches:

      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Build Docker image
        run: |
          docker build \
            -t scientific-calculator-cpp \
            .


      - name: Start calculator server
        run: |
          docker run \
            -d \
            --name scientific-calculator \
            -p 8080:8080 \
            scientific-calculator-cpp


      - name: Wait for C++ server
        run: |
          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8080/health
            then

              echo
              echo "C++ server is healthy."

              exit 0

            fi

            echo "Waiting for server..."

            sleep 2

          done

          docker logs scientific-calculator

          exit 1


      - name: Test Version 3 website
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/)

          echo "$RESPONSE" | \
            grep "v3.0"

          echo "$RESPONSE" | \
            grep "C++ Expression Engine"


      - name: Test health endpoint
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8080/health)

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep '"version":"3.0"'

          echo "$RESPONSE" | \
            grep '"engine":"cpp-expression-parser"'


      - name: Test arithmetic precedence
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2+3*4"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep '"result":14'


      - name: Test parentheses
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(2+3)*4"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep '"result":20'


      - name: Test power
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"2^8"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep '"result":256'


      - name: Test nested power
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(2+3)^4"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep '"result":625'


      - name: Test factorial
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"5!"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep '"result":120'


      - name: Test square root
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sqrt(144)"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep '"result":12'


      - name: Test sine
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(30)"}')

          echo "$RESPONSE"


      - name: Test compound scientific expression
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"sin(30)+sqrt(144)"}')

          echo "$RESPONSE"


      - name: Test constants
        run: |
          RESPONSE=$(curl -fsS \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"pi*2"}')

          echo "$RESPONSE"


      - name: Test divide by zero
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"10/0"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep '"error":"Cannot divide by zero."'


      - name: Test invalid parentheses
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            http://localhost:8080/api/evaluate \
            -H "Content-Type: application/json" \
            -d '{"expression":"(2+3"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | \
            grep "Missing closing parenthesis"


      - name: Show container logs
        if: always()
        run: |
          docker logs scientific-calculator 2>/dev/null || true
